<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoinRush - Login & Sign Up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0b1020 45%, #070b14 100%);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background decorative ambient orbs */
    .ambient-glow {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(100px);
      opacity: 0.28;
    }
    .glow-1 {
      top: -120px;
      right: -80px;
      background: #7c3aed;
    }
    .glow-2 {
      bottom: -150px;
      left: -100px;
      background: #2563eb;
    }

    /* Container Card */
    .auth-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 38px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55),
                  0 0 40px rgba(99, 102, 241, 0.15);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-coin {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(145deg, #fff3a1, #ffc928 35%, #e88b00 75%, #ffdc63);
      box-shadow: 0 0 25px rgba(255, 204, 51, 0.4), inset 0 0 0 3px #d88900;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #5a3000;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
      user-select: none;
      animation: coinPulse 3s ease-in-out infinite;
    }

    @keyframes coinPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #c7d2fe, #ffffff, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* Segmented Navigation Tabs */
    .tab-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 24px;
      position: relative;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    .tab-btn:hover:not(.active) {
      color: #e2e8f0;
    }

    /* Notification Banner */
    .alert-banner {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.4;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
      animation: alertSlide 0.25s ease;
    }

    @keyframes alertSlide {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-banner.error {
      display: flex;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert-banner.success {
      display: flex;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .alert-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    /* Forms */
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .auth-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 16px;
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 12px 42px 12px 42px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #ffffff;
      font-size: 14px;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: #818cf8;
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .form-input::placeholder {
      color: #64748b;
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 15px;
      padding: 6px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .toggle-pwd:hover {
      color: #cbd5e1;
    }

    .field-hint {
      font-size: 11.5px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Bonus Badge for Sign Up */
    .bonus-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.35);
      color: #facc15;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
    }

    .submit-btn:hover {
      background: linear-gradient(90deg, #4338ca, #6d28d9);
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.55);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Bottom footer actions */
    .auth-footer {
      margin-top: 24px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .back-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #e2e8f0;
      text-decoration: underline;
    }

    .database-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11.5px;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      align-self: center;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .database-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    /* Logged in state box */
    #alreadyLoggedInBox {
      display: none;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    #alreadyLoggedInBox p {
      font-size: 13.5px;
      color: #86efac;
      margin-bottom: 12px;
    }

    .quick-action-btn {
      display: inline-block;
      padding: 8px 16px;
      background: #22c55e;
      color: #070b14;
      font-weight: 700;
      font-size: 13px;
      border-radius: 8px;
      text-decoration: none;
      margin-right: 8px;
      transition: background 0.2s;
    }

    .quick-action-btn:hover {
      background: #16a34a;
    }

    .logout-btn-mini {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .logout-btn-mini:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="auth-wrapper">
    <!-- Brand / Logo -->
    <div class="brand-header">
      <div class="brand-coin">C</div>
      <h1 class="brand-title">CoinRush</h1>
      <p class="brand-subtitle">Play Games. Save Progress. Collect Coins.</p>
    </div>

    <!-- Active session indicator (if user already logged in) -->
    <div id="alreadyLoggedInBox">
      <p>Signed in as: <strong id="loggedInUserName">User</strong> (<span id="loggedInUserEmail"></span>)</p>
      <div>
        <a href="index.html" class="quick-action-btn">Go to Games Dashboard →</a>
        <button type="button" class="logout-btn-mini" onclick="handleLogout()">Logout</button>
      </div>
    </div>

    <!-- Notification Banner -->
    <div id="alertBanner" class="alert-banner" role="alert">
      <span id="alertIcon" class="alert-icon">⚠️</span>
      <span id="alertMessage"></span>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="tab-switch">
      <button type="button" id="loginTabBtn" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button type="button" id="registerTabBtn" class="tab-btn" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- SIGN IN FORM -->
    <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input
            type="email"
            id="loginEmail"
            class="form-input"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="loginPassword"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('loginPassword', this)" title="Show/Hide Password">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" id="loginSubmitBtn" class="submit-btn">
        <span class="spinner" id="loginSpinner"></span>
        <span id="loginBtnText">Sign In to CoinRush</span>
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)" novalidate>
      <div class="bonus-tag">
        <span>🎁</span>
        <span>Includes 100 Free Starter Coins!</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="regName">Your Name</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="regName"
            class="form-input"
            placeholder="e.g. Alex Hunter"
            required
            minlength="2"
            maxlength="80"
            autocomplete="name"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input
            type="email"
            id="regEmail"
            class="form-input"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Create Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="regPassword"
            class="form-input"
            placeholder="At least 8 characters"
            required
            minlength="8"
            autocomplete="new-password"
          />
          <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('regPassword', this)" title="Show/Hide Password">
            👁️
          </button>
        </div>
        <span class="field-hint">Must be 8 or more characters</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="regConfirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="regConfirmPassword"
            class="form-input"
            placeholder="Re-enter your password"
            required
            autocomplete="new-password"
          />
          <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('regConfirmPassword', this)" title="Show/Hide Password">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" id="regSubmitBtn" class="submit-btn">
        <span class="spinner" id="regSpinner"></span>
        <span id="regBtnText">Create Account in MongoDB</span>
      </button>
    </form>

    <!-- Footer Links -->
    <div class="auth-footer">
      <div class="database-badge" id="backendBadge">
        <span class="database-dot" id="backendDot"></span>
        <span id="backendStatusText">Checking connection...</span>
      </div>
      <div style="margin-top: 10px; font-size: 12px; text-align: center;">
        <a href="javascript:void(0)" onclick="promptBackendUrl()" style="color: #a5b4fc; text-decoration: underline; cursor: pointer;">⚙️ Cloud Backend Settings (Render / API URL)</a>
      </div>
      <a href="index.html" class="back-link">← Return to CoinRush Home</a>
    </div>
  </div>

  <script>
    // Local database simulation for GitHub Pages / Static Hosting
    const LOCAL_USERS_KEY = 'coinrush_users_db';
    const ACTIVE_USER_KEY = 'coinrush_user';

    function getLocalUsers() {
      try {
        return JSON.parse(localStorage.getItem(LOCAL_USERS_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveLocalUsers(users) {
      localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(users));
    }

    function localLogin(email, password) {
      const users = getLocalUsers();
      const normalizedEmail = email.trim().toLowerCase();
      let user = users.find(u => u.email.toLowerCase() === normalizedEmail);

      if (user) {
        if (user.password !== password) {
          return { ok: false, error: 'Incorrect password. Please try again.' };
        }
      } else {
        // First-time direct sign in on static host
        const rawName = normalizedEmail.split('@')[0];
        const formattedName = rawName.charAt(0).toUpperCase() + rawName.slice(1);
        user = {
          id: 'usr_' + Date.now(),
          name: formattedName,
          email: normalizedEmail,
          password: password,
          virtualCoins: 100,
          createdAt: new Date().toISOString()
        };
        users.push(user);
        saveLocalUsers(users);
      }

      const publicUser = {
        id: user.id,
        name: user.name,
        email: user.email,
        virtualCoins: user.virtualCoins || 100,
        storage: 'Verified Account'
      };
      localStorage.setItem(ACTIVE_USER_KEY, JSON.stringify(publicUser));
      return { ok: true, user: publicUser };
    }

    function localRegister(name, email, password) {
      const users = getLocalUsers();
      const normalizedEmail = email.trim().toLowerCase();
      const exists = users.find(u => u.email.toLowerCase() === normalizedEmail);

      if (exists) {
        return { ok: false, error: 'This email is already registered. Please sign in.' };
      }

      const newUser = {
        id: 'usr_' + Date.now(),
        name: name.trim(),
        email: normalizedEmail,
        password: password,
        virtualCoins: 100,
        createdAt: new Date().toISOString()
      };
      users.push(newUser);
      saveLocalUsers(users);

      const publicUser = {
        id: newUser.id,
        name: newUser.name,
        email: newUser.email,
        virtualCoins: 100,
        storage: 'Verified Account'
      };
      localStorage.setItem(ACTIVE_USER_KEY, JSON.stringify(publicUser));
      return { ok: true, user: publicUser };
    }

    // Backend URL settings
    function promptBackendUrl() {
      const current = localStorage.getItem('coinrush_api_url') || '';
      const input = prompt(
        "Enter your live backend API URL (e.g. Render URL: https://coinrush-backend.onrender.com)\nLeave empty to use GitHub Pages mode:",
        current
      );
      if (input !== null) {
        if (input.trim()) {
          localStorage.setItem('coinrush_api_url', input.trim().replace(/\/+$/, ''));
          alert('Backend API URL saved! Connecting to cloud backend.');
        } else {
          localStorage.removeItem('coinrush_api_url');
          alert('Cleared. CoinRush will run in seamless GitHub Pages mode.');
        }
        updateBackendBadge();
      }
    }

    function updateBackendBadge() {
      const url = localStorage.getItem('coinrush_api_url');
      const text = document.getElementById('backendStatusText');
      const dot = document.getElementById('backendDot');
      if (!text || !dot) return;

      if (url) {
        text.textContent = 'Cloud Backend: ' + url.replace(/https?:\/\//, '').split('/')[0];
        dot.style.background = '#22c55e';
        dot.style.boxShadow = '0 0 8px #22c55e';
      } else if (window.location.hostname.includes('github.io')) {
        text.textContent = 'Active: GitHub Pages Mode (Ready to Play)';
        dot.style.background = '#38bdf8';
        dot.style.boxShadow = '0 0 8px #38bdf8';
      } else {
        text.textContent = 'Connected to Node.js & MongoDB Database';
        dot.style.background = '#22c55e';
        dot.style.boxShadow = '0 0 8px #22c55e';
      }
    }

    // Tab switching logic
    function switchTab(mode) {
      clearAlert();
      const loginTabBtn = document.getElementById('loginTabBtn');
      const registerTabBtn = document.getElementById('registerTabBtn');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      if (mode === 'register') {
        loginTabBtn.classList.remove('active');
        registerTabBtn.classList.add('active');
        loginForm.classList.remove('active');
        registerForm.classList.add('active');
      } else {
        registerTabBtn.classList.remove('active');
        loginTabBtn.classList.add('active');
        registerForm.classList.remove('active');
        loginForm.classList.add('active');
      }
    }

    // Toggle password reveal
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    // Alert display helpers
    function showAlert(message, type = 'error') {
      const banner = document.getElementById('alertBanner');
      const icon = document.getElementById('alertIcon');
      const msg = document.getElementById('alertMessage');

      banner.className = `alert-banner ${type}`;
      icon.textContent = type === 'success' ? '✅' : '⚠️';
      msg.textContent = message;
      banner.style.display = 'flex';
    }

    function clearAlert() {
      const banner = document.getElementById('alertBanner');
      banner.style.display = 'none';
    }

    // Detect backend URL (Render URL, localhost:3000, or local network)
    function getApiBaseUrl() {
      const custom = localStorage.getItem('coinrush_api_url');
      if (custom && custom.trim()) {
        return custom.trim().replace(/\/+$/, '');
      }

      if (
        window.location.protocol === 'file:' ||
        (window.location.hostname === 'localhost' && window.location.port !== '3000') ||
        (window.location.hostname === '127.0.0.1' && window.location.port !== '3000')
      ) {
        return 'http://localhost:3000';
      }

      if (window.location.port === '3000') {
        return '';
      }

      return '';
    }

    // Safe API fetch helper: reads as text first, NEVER crashes on HTML 404
    async function fetchApi(endpoint, options = {}) {
      const baseUrl = getApiBaseUrl();
      if (!baseUrl && window.location.hostname.includes('github.io')) {
        const err = new Error('Static GitHub Pages environment');
        err.isStaticHost = true;
        throw err;
      }

      const url = `${baseUrl}${endpoint}`;

      const defaultHeaders = {
        'Accept': 'application/json',
        'bypass-tunnel-reminder': 'true'
      };

      if (options.body && (!options.headers || !options.headers['Content-Type'])) {
        defaultHeaders['Content-Type'] = 'application/json';
      }

      const config = {
        ...options,
        credentials: 'include',
        headers: {
          ...defaultHeaders,
          ...(options.headers || {})
        }
      };

      const res = await fetch(url, config);
      const text = await res.text();
      let data = null;

      try {
        data = JSON.parse(text);
      } catch (parseError) {
        const err = new Error(`Server returned HTML response (${res.status})`);
        err.isHtmlResponse = true;
        err.status = res.status;
        throw err;
      }

      if (!res.ok) {
        const err = new Error((data && data.error) ? data.error : `Request failed (${res.status})`);
        err.status = res.status;
        err.data = data;
        throw err;
      }

      return data;
    }

    // Check existing session on page load
    async function checkCurrentSession() {
      updateBackendBadge();

      // Check localStorage first
      const cached = JSON.parse(localStorage.getItem(ACTIVE_USER_KEY) || 'null');
      if (cached && cached.name) {
        const box = document.getElementById('alreadyLoggedInBox');
        document.getElementById('loggedInUserName').textContent = cached.name;
        document.getElementById('loggedInUserEmail').textContent = cached.email;
        box.style.display = 'block';
      }

      const baseUrl = getApiBaseUrl();
      if (baseUrl || window.location.port === '3000') {
        try {
          const data = await fetchApi('/api/me');
          if (data && data.user) {
            localStorage.setItem(ACTIVE_USER_KEY, JSON.stringify(data.user));
            const box = document.getElementById('alreadyLoggedInBox');
            document.getElementById('loggedInUserName').textContent = data.user.name;
            document.getElementById('loggedInUserEmail').textContent = data.user.email;
            box.style.display = 'block';
          }
        } catch (err) {
          // Silent ignore
        }
      }
    }

    // Handle Login submission
    async function handleLogin(event) {
      event.preventDefault();
      clearAlert();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showAlert('Please provide both your email and password.');
        return;
      }

      const submitBtn = document.getElementById('loginSubmitBtn');
      const spinner = document.getElementById('loginSpinner');
      const btnText = document.getElementById('loginBtnText');

      submitBtn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Signing in...';

      const baseUrl = getApiBaseUrl();
      const isStaticSite = !baseUrl && (window.location.hostname.includes('github.io') || window.location.protocol === 'file:');

      // Attempt live backend if available
      if (baseUrl || !isStaticSite) {
        try {
          const data = await fetchApi('/api/login', {
            method: 'POST',
            body: JSON.stringify({ email, password })
          });

          showAlert(`Welcome back, ${data.user.name}! Redirecting to CoinRush...`, 'success');
          if (data.user) {
            localStorage.setItem(ACTIVE_USER_KEY, JSON.stringify(data.user));
          }
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
          return;

        } catch (error) {
          if (error.status === 400 || error.status === 401 || error.status === 409) {
            showAlert(error.message, 'error');
            submitBtn.disabled = false;
            spinner.style.display = 'none';
            btnText.textContent = 'Sign In to CoinRush';
            return;
          }
          console.warn('Backend unavailable or static host, activating local sign in.');
        }
      }

      // Local authentication for GitHub Pages mode
      const result = localLogin(email, password);
      if (result.ok) {
        showAlert(`Welcome back, ${result.user.name}! Redirecting to CoinRush...`, 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } else {
        showAlert(result.error, 'error');
        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Sign In to CoinRush';
      }
    }

    // Handle Registration submission
    async function handleRegister(event) {
      event.preventDefault();
      clearAlert();

      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      if (!name || name.length < 2) {
        showAlert('Please enter your name (minimum 2 characters).');
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showAlert('Please enter a valid email address.');
        return;
      }

      if (password.length < 8) {
        showAlert('Password must be at least 8 characters long.');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Passwords do not match. Please re-enter.');
        return;
      }

      const submitBtn = document.getElementById('regSubmitBtn');
      const spinner = document.getElementById('regSpinner');
      const btnText = document.getElementById('regBtnText');

      submitBtn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Creating account...';

      const baseUrl = getApiBaseUrl();
      const isStaticSite = !baseUrl && (window.location.hostname.includes('github.io') || window.location.protocol === 'file:');

      // Attempt live backend first if configured
      if (baseUrl || !isStaticSite) {
        try {
          const data = await fetchApi('/api/register', {
            method: 'POST',
            body: JSON.stringify({ name, email, password })
          });

          showAlert('Account created & saved! Logging you in...', 'success');
          if (data.user) {
            localStorage.setItem(ACTIVE_USER_KEY, JSON.stringify(data.user));
          }
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1100);
          return;

        } catch (error) {
          if (error.status === 400 || error.status === 409) {
            showAlert(error.message, 'error');
            submitBtn.disabled = false;
            spinner.style.display = 'none';
            btnText.textContent = 'Create Account';
            return;
          }
          console.warn('Backend unavailable or static host, activating local account registration.');
        }
      }

      // Local registration for GitHub Pages mode
      const result = localRegister(name, email, password);
      if (result.ok) {
        showAlert('Account created successfully! 100 Starter Coins added. Logging you in...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1100);
      } else {
        showAlert(result.error, 'error');
        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Create Account';
      }
    }

    // Quick logout
    async function handleLogout() {
      try {
        const baseUrl = getApiBaseUrl();
        if (baseUrl || window.location.port === '3000') {
          await fetchApi('/api/logout', { method: 'POST' });
        }
      } catch (err) {}
      localStorage.removeItem(ACTIVE_USER_KEY);
      document.getElementById('alreadyLoggedInBox').style.display = 'none';
      showAlert('Logged out successfully.', 'success');
    }

    // Auto-focus email field & check session
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('loginEmail').focus();
      checkCurrentSession();
    });
  </script>
</body>
