    :root {

      --text-muted: #64748b;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;

    .btn-primary { background: var(--accent); color: #fff; }
